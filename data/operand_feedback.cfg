[operand_feedback]
format = 1
fallback = incompatible_operand_generic

[defaults]
box = center
box_size = large
text_size = normal
header = instruction_feedback
dismiss = mouse_press

[mov_output_buffer_as_source]
diagnostic = MOV_OUTPUT_BUFFER_AS_SOURCE
text_begin
@warning INVALID SOURCE OPERAND

Output Buffer [ob] is write-only and cannot provide a source value.

@directive To write rax to [ob]:
@syntax MOV [ob], rax
text_end

[mov_input_buffer_as_destination]
diagnostic = MOV_INPUT_BUFFER_AS_DESTINATION
text_begin
@warning INVALID DESTINATION OPERAND

Input Buffer [ib] is read-only and cannot receive a destination value.

@directive Read [ib] into a register:
@syntax MOV rax, [ib]
text_end

[mov_buffer_to_buffer]
diagnostic = MOV_BUFFER_TO_BUFFER
text_begin
@warning COMBINATION NOT ALLOWED

MOV cannot copy directly between buffers.

@directive Move through a register:
@syntax MOV rax, [ib]
@syntax MOV [ob], rax
text_end

[incompatible_operand_generic]
diagnostic = INCOMPATIBLE_OPERAND_GENERIC
text_begin
@warning OPERAND COMBINATION NOT ALLOWED

This operand is not valid in the selected position.

@directive Select a compatible operand.
text_end
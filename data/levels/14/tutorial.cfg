[tutorial]
format = 1



[welcome]
box = center_up
box_size = large
text_size = large
header = system_message
dismiss = mouse_press
when.code_size = 0
text_begin
ADDRESS 0E
text_end


[introduce_jump_not_equal]
box = code
box_size = large
header = system_notice
highlight_instruction = JNE
dismiss = mouse_press
when.code_size = 0
text_begin
JNE instruction is now available
text_end


[explain_jump_not_equal]
box = center_right
header = instruction
box_size = large
dismiss = mouse_press
highlight_instruction = JNE
highlight = zero_flag
when.code_size = 0
text_begin
JNE jumps when ZF is clear (ZF = 0)
 
Otherwise, execution continues
text_end


[explain_zero_flag_clear]
box = lower
header = instruction
box_size = large
dismiss = mouse_press
highlight_instruction = CMP
highlight = zero_flag
when.code_size = 0
text_begin
CMP clears the Zero Flag 

(ZF = 0) 

when the operands differ
text_end


[explain_zero_flag_set]
box = center_right
header = instruction
box_size = large
dismiss = mouse_press
highlight_instruction = CMP
highlight = zero_flag
when.code_size = 0
text_begin
CMP sets the Zero Flag 

(ZF = 1) 

when both operands 
are equal
text_end

[complete_compare_branch_program]
box = center
box_size = large
header = instruction
dismiss = mouse_press
highlight = challenge
when.code_size = 0
text_begin
Correct execution requires the use of CMP, JE, and JNE
text_end

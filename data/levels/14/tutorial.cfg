[tutorial]
format = 1



[welcome]
box = big
header = system_message
dismiss = mouse_press
id = 0
when.code_size = 0
text_begin
ADDRESS 0E
text_end


[introduce_jump_not_equal]
box = code
header = system_notice
dismiss = mouse_press
arrow = instruction
id = 1
when.code_size = 0
text_begin
JNE instruction is now available
text_end


[explain_jump_not_equal]
box = center_right
header = instruction
dismiss = mouse_press
arrow = zero_flag
id = 2
when.code_size = 0
text_begin
JNE jumps when ZF is clear
 
Otherwise, execution continues
text_end


[explain_zero_flag_clear]
box = lower
header = instruction
dismiss = mouse_press
arrow = zero_flag
id = 3
when.code_size = 0
text_begin
CMP clears the Zero Flag (ZF) when the operands differ
text_end


[explain_zero_flag_set]
box = center_right
header = instruction
dismiss = mouse_press
arrow = zero_flag
id = 4
when.code_size = 0
text_begin
CMP sets the Zero Flag (ZF) when both operands are equal
text_end



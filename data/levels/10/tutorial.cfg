[tutorial]
format = 1



[welcome]
box = big
header = system_message
dismiss = mouse_press
when.code_size = 0
text_begin
ADDRESS 0A
text_end


[introduce_immediates]
box = center
header = system_notice
dismiss = mouse_press
arrow = immediate
when.code_size = 0
text_begin
An additional section has been enabled
text_end


[select_immediate]
box = upper_right
header = system_notice
dismiss = mouse_press
arrow = immediate
when.code_size = 0
text_begin
Immediate values are available for selection
text_end


[explain_immediate_read_only]
box = center
header = instruction
dismiss = mouse_press
arrow = immediate
when.code_size = 0
text_begin
Immediate operands are read-only source operands
text_end


[show_immediate_examples]
box = upper_right
header = instruction
dismiss = mouse_press
arrow = immediate
when.code_size = 0
text_begin
Usage examples:
 
MOV rax, 5
ADD rbx, 10
text_end



[tutorial]
format = 1


[welcome]
box = center_up
box_size = large
text_size = large
header = system_message
dismiss = mouse_press
when.code_size = 0
effects.code_editable = 0
text_begin
ADDRESS 0A
text_end


[introduce_immediates]
box = center
box_size = large
header = system_notice
dismiss = mouse_press
arrow = immediate
when.code_size = 0
effects.code_editable = 0
text_begin
Immediate values are constants encoded directly in an instruction

They can only be assigned as source operands
text_end


[explain_immediate_addition]
box = upper_right
box_size = large
header = instruction
dismiss = mouse_press
arrow = immediate
highlight_instruction = ADD
when.code_size = 0
effects.code_editable = 0
text_begin
@syntax ADD rax, 5

Adds 5 to rax and stores the result in rax
text_end
[tutorial]
format = 1



[welcome]
box = big
header = system_message
dismiss = mouse_press
id = 0
when.code_size = 3
text_begin
ADDRESS 01
text_end


[introduce_editing]
box = upper
header = instruction
dismiss = mouse_press
id = 1
when.code_size = 3
text_begin
Instructions order and operands can be modified
text_end


[select_last_instruction]
box = code
header = instruction
dismiss = none
arrow = code
id = 2
when.code_size = 3
when.holding = 0
effects.code_editable = 0
effects.code_editable_exception = last_line
text_begin
Remove the final instruction from the execution sequence
text_end


[delete_last_instruction]
box = code
header = instruction
dismiss = none
arrow = delete
id = 3
when.code_size = 3
when.holding = 1
effects.arrange_enabled = 0
text_begin
Extract the instruction from the program sequence to remove it
text_end


[select_source_operand]
box = code
header = instruction
dismiss = none
arrow = operand_two
id = 4
when.code_size = 2
when.holding = 0
when.last_operand_1 = RAX
when.last_operand_2 = RAX
when.last_line_state = COMPLETE
effects.code_editable = 0
effects.code_editable_exception = last_operand_2
effects.delete_enabled = 0
text_begin
Change the instruction Source Operand to update its behavior
text_end


[set_source_to_input]
box = upper
header = instruction
dismiss = none
arrow = input_buffer
id = 5
when.code_size = 2
when.holding = 0
when.last_operand_1 = RAX
when.last_operand_2 = RAX
when.last_line_state = CHANGING_OP2
effects.code_editable = 0
effects.code_editable_exception = last_operand_2
effects.delete_enabled = 0
text_begin
Set the Source Operand to [ib]
text_end


[reorder_instructions]
box = code
header = instruction
dismiss = none
arrow = code
id = 6
when.holding = 0
when.code_size = 2
when.first_operand_1 = OB
when.first_operand_2 = RAX
when.last_operand_1 = RAX
when.last_operand_2 = IB
effects.code_editable = 0
effects.code_editable_exception = last_line
effects.arrange_enabled = 1
effects.delete_enabled = 0
text_begin
Adjust instruction order so the second instruction executes first
text_end

[reorder_instructions_holding]
box = code
header = instruction
dismiss = none
arrow = drop
id = 7
when.code_size_max = 2
when.holding = 1
when.held_instruction = MOV
effects.arrange_enabled = 1
effects.delete_enabled = 0
text_begin
Place the instruction at the beginning of the execution sequence
text_end


[run_program]
box = code
header = instruction
dismiss = none
arrow = play
id = 8
when.code_size = 2
when.holding = 0
when.first_operand_1 = RAX
when.first_operand_2 = IB
when.last_operand_1 = OB
when.last_operand_2 = RAX
when.play_state = 0
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
Initiate Program Execution
text_end



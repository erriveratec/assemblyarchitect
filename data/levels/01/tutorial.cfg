[tutorial]
format = 1



[welcome]
box = big
header = system_message
dismiss = mouse_press
id = 0
text_begin
ADDRESS 01
text_end


[introduce_editing]
box = upper
header = instruction
dismiss = mouse_press
id = 1
text_begin
Instructions order and operands can be modified
text_end


[select_last_instruction]
box = instruction
header = instruction
dismiss = none
id = 2
text_begin
Remove the final instruction from the execution sequence
text_end


[delete_last_instruction]
box = instruction
header = instruction
dismiss = none
id = 3
text_begin
Extract the instruction from the program sequence to remove it
text_end


[select_source_operand]
box = instruction
header = instruction
dismiss = none
id = 4
text_begin
Change the instruction Source Operand to update its behavior
text_end


[set_source_to_input]
box = big
header = system_message
dismiss = mouse_press
id = 5
text_begin
Set the Source Operand to [ib]
text_end


[reorder_instructions]
box = instruction
header = instruction
dismiss = none
id = 6
text_begin
Adjust instruction order so the second instruction executes first
text_end


[run_program]
box = instruction
header = instruction
dismiss = none
id = 7
text_begin
Initiate Program Execution
text_end



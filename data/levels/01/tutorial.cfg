[tutorial]
format = 1


[welcome]
box = center_up
box_size = large
text_size = large
header = system_message
dismiss = mouse_press
when.code_size = 3
effects.code_editable = 0
text_begin
ADDRESS 01
text_end


[review_challenge]
box = upper
header = instruction
dismiss = mouse_press
highlight = challenge
when.code_size = 3
effects.code_editable = 0
text_begin
Review the task and the two-instruction limit
text_end


[inspect_program]
box = center_right
box_size = large
header = instruction
dismiss = mouse_press
highlight = code_box
when.code_size = 3
effects.code_editable = 0
text_begin
The program has three instructions

The limit is two
text_end


[editing_plan]
box = lower
box_size = large
header = instruction
dismiss = mouse_press
highlight = code_box
when.code_size = 3
effects.code_editable = 0
text_begin
Correct the program:

1) Remove the extra instruction
2) Change a Source
3) Fix the instruction order
text_end


[select_last_instruction]
box = code
header = instruction
dismiss = none
arrow = code
highlight = code_box
when.code_size = 3
when.holding = 0
effects.code_editable = 0
effects.code_editable_exception = last_line
effects.arrange_enabled = 0
effects.delete_enabled = 1
text_begin
Select and drag the final instruction
text_end


[delete_last_instruction]
box = code
header = instruction
dismiss = none
arrow = delete
highlight = code_box
when.code_size = 3
when.held_instruction = MOV
when.holding = 1
effects.arrange_enabled = 0
effects.delete_enabled = 1
text_begin
Drop it outside the program to remove it
text_end


[delete_last_instruction_outside]
box = code
header = instruction
dismiss = none
arrow = delete
highlight = code_box
priority = 20
when.code_size = 2
when.holding = 1
when.held_instruction = MOV
when.first_operand_1 = OB
when.first_operand_2 = RAX
when.last_operand_1 = RAX
when.last_operand_2 = RAX
effects.arrange_enabled = 0
effects.delete_enabled = 1
text_begin
Drop it outside the program to remove it
text_end


[review_remaining_program]
box = center_right
box_size = large
header = system_notice
dismiss = mouse_press
highlight = code_box,register,input_buffer
when.code_size = 2
when.holding = 0
when.last_operand_1 = RAX
when.last_operand_2 = RAX
when.last_line_state = COMPLETE
effects.code_editable = 0
effects.delete_enabled = 0
text_begin
The final MOV copies rax into itself

Change its Source to [ib]
text_end


[select_source_operand]
box = code
header = instruction
dismiss = none
arrow = operand_two
highlight = code_box
when.code_size = 2
when.holding = 0
when.last_operand_1 = RAX
when.last_operand_2 = RAX
when.last_line_state = COMPLETE
effects.code_editable = 0
effects.code_editable_exception = last_operand_2
effects.delete_enabled = 0
text_begin
Select the Source of the final MOV
text_end


[set_source_to_input]
box = upper
header = instruction
dismiss = none
arrow = input_buffer
highlight = input_buffer
when.code_size = 2
when.holding = 0
when.last_operand_1 = RAX
when.last_operand_2 = RAX
when.last_line_state = CHANGING_OP2
effects.code_editable = 0
effects.code_editable_exception = last_operand_2
effects.buffer_selectable = 1
effects.register_selectable = 0
effects.delete_enabled = 0
text_begin
Select [ib] as the new Source
text_end


[review_instruction_order]
box = center_right
box_size = large
header = system_notice
dismiss = mouse_press
highlight = code_box,input_buffer,register,output_buffer
when.holding = 0
when.code_size = 2
when.first_operand_1 = OB
when.first_operand_2 = RAX
when.last_operand_1 = RAX
when.last_operand_2 = IB
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
Instructions run from top to bottom

rax is used before it receives a value

MOV rax, [ib] must run first
text_end


[reorder_instructions]
box = code
header = instruction
dismiss = none
arrow = code
highlight = code_box
when.holding = 0
when.code_size = 2
when.first_operand_1 = OB
when.first_operand_2 = RAX
when.last_operand_1 = RAX
when.last_operand_2 = IB
effects.code_editable = 0
effects.code_editable_exception = last_line
effects.arrange_enabled = 1
effects.delete_enabled = 0
text_begin
Select and drag MOV rax, [ib]
text_end


[reorder_instructions_holding]
box = code
header = instruction
dismiss = none
highlight = code_box
priority = 10
when.code_size = 2
when.holding = 1
when.held_instruction = MOV
when.first_operand_1 = OB
when.first_operand_2 = RAX
when.last_operand_1 = RAX
when.last_operand_2 = IB
effects.code_editable = 0
effects.arrange_enabled = 1
effects.delete_enabled = 0
text_begin
Place it at the beginning of the program
text_end

[reorder_instructions_holding_first]
box = code
header = instruction
dismiss = none
highlight = code_box
priority = 20
when.code_size = 2
when.holding = 1
when.held_instruction = MOV
when.first_operand_1 = RAX
when.first_operand_2 = IB
when.last_operand_1 = OB
when.last_operand_2 = RAX
effects.code_editable = 0
effects.arrange_enabled = 1
effects.delete_enabled = 0
text_begin
Release it at the beginning of the program
text_end

[review_corrected_program]
box = center_right
box_size = large
header = system_notice
dismiss = mouse_press
highlight = code_box,input_buffer,register,output_buffer
when.code_size = 2
when.holding = 0
when.first_operand_1 = RAX
when.first_operand_2 = IB
when.last_operand_1 = OB
when.last_operand_2 = RAX
when.play_state = 0
when.won = 0
when.operation_error = 0
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
The program now follows the data path:

[ib] -> rax -> [ob]
text_end


[run_program]
box = code
header = instruction
dismiss = none
arrow = play
highlight = code_box
when.code_size = 2
when.holding = 0
when.first_operand_1 = RAX
when.first_operand_2 = IB
when.last_operand_1 = OB
when.last_operand_2 = RAX
when.play_state = 0
when.won = 0
when.operation_error = 0
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
Run the corrected program
text_end


[completion]
box = upper_right
box_size = large
header = system_message
dismiss = none
highlight = code_box
when.won = 1
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
Run completed

Edit operands and order to correct existing programs
text_end

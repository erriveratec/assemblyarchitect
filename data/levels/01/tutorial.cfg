[tutorial]
format = 1


[welcome]
box = center_up
box_size = large
text_size = large
header = system_message
dismiss = mouse_press
when.code_size = 3
effects.code_editable = 0
text_begin
ADDRESS 01
text_end


[review_challenge]
box = upper
box_size = large
header = instruction
dismiss = mouse_press
highlight = challenge,code_box
when.code_size = 3
effects.code_editable = 0
text_begin
The instruction sequence exceeds the execution limit

@directive Reduce the sequence to two instructions
text_end


[select_last_instruction]
box = code
header = instruction
dismiss = none
arrow = code
highlight = code_box
when.code_size = 3
when.holding = 0
effects.code_editable = 0
effects.code_editable_exception = last_line
effects.arrange_enabled = 0
effects.delete_enabled = 1
text_begin
The final MOV is redundant

@directive Hold the final instruction
text_end


[delete_last_instruction]
box = code
header = instruction
dismiss = none
arrow = delete
highlight = code_box
when.code_size = 3
when.held_instruction = MOV
when.holding = 1
effects.arrange_enabled = 0
effects.delete_enabled = 1
text_begin
@directive Remove the held instruction from the sequence
text_end


[delete_last_instruction_outside]
box = code
header = instruction
dismiss = none
arrow = delete
highlight = code_box
priority = 20
when.code_size = 2
when.holding = 1
when.held_instruction = MOV
when.first_operand_1 = OB
when.first_operand_2 = RAX
when.last_operand_1 = RAX
when.last_operand_2 = RAX
effects.arrange_enabled = 0
effects.delete_enabled = 1
text_begin
@directive Release the instruction outside the sequence
text_end


[select_source_operand]
box = center
box_size = large
header = instruction
dismiss = none
arrow = operand_two
highlight = code_box
when.code_size = 2
when.holding = 0
when.last_operand_1 = RAX
when.last_operand_2 = RAX
when.last_line_state = COMPLETE
effects.code_editable = 0
effects.code_editable_exception = last_operand_2
effects.delete_enabled = 0
text_begin
@syntax MOV rax, rax

The source and destination reference the same register

@directive Replace the source operand
text_end


[set_source_to_input]
box = upper
header = instruction
dismiss = none
arrow = input_buffer
highlight = input_buffer
when.code_size = 2
when.holding = 0
when.last_operand_1 = RAX
when.last_operand_2 = RAX
when.last_line_state = CHANGING_OP2
effects.code_editable = 0
effects.code_editable_exception = last_operand_2
effects.buffer_selectable = 1
effects.register_selectable = 0
effects.delete_enabled = 0
text_begin
[ib] provides the required value

@directive Assign [ib] as the source operand
text_end


[review_instruction_order]
box = center_right
box_size = large
header = system_notice
dismiss = mouse_press
highlight = code_box,input_buffer,register,output_buffer
when.holding = 0
when.code_size = 2
when.first_operand_1 = OB
when.first_operand_2 = RAX
when.last_operand_1 = RAX
when.last_operand_2 = IB
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
Execution proceeds from top to bottom

rax is used before receiving the input value

MOV rax, [ib] must execute first
text_end


[reorder_instructions]
box = code
header = instruction
dismiss = none
arrow = code
highlight = code_box
when.holding = 0
when.code_size = 2
when.first_operand_1 = OB
when.first_operand_2 = RAX
when.last_operand_1 = RAX
when.last_operand_2 = IB
effects.code_editable = 0
effects.code_editable_exception = last_line
effects.arrange_enabled = 1
effects.delete_enabled = 0
text_begin
@directive Hold the last instruction for reordering:

@syntax MOV rax, [ib]
text_end


[reorder_instructions_holding]
box = code
header = instruction
dismiss = none
highlight = code_box
priority = 10
when.code_size = 2
when.holding = 1
when.held_instruction = MOV
when.first_operand_1 = OB
when.first_operand_2 = RAX
when.last_operand_1 = RAX
when.last_operand_2 = IB
effects.code_editable = 0
effects.arrange_enabled = 1
effects.delete_enabled = 0
text_begin
@directive Place the held instruction at the first position
text_end


[reorder_instructions_holding_first]
box = code
header = instruction
dismiss = none
highlight = code_box
priority = 20
when.code_size = 2
when.holding = 1
when.held_instruction = MOV
when.first_operand_1 = RAX
when.first_operand_2 = IB
when.last_operand_1 = OB
when.last_operand_2 = RAX
effects.code_editable = 0
effects.arrange_enabled = 1
effects.delete_enabled = 0
text_begin
@directive Commit the instruction to the first position
text_end


[run_program]
box = code
header = instruction
dismiss = none
arrow = play
highlight = code_box
when.code_size = 2
when.holding = 0
when.first_operand_1 = RAX
when.first_operand_2 = IB
when.last_operand_1 = OB
when.last_operand_2 = RAX
when.play_state = 0
when.won = 0
when.operation_error = 0
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
@directive Initiate sequence execution
text_end


[completion]
box = upper_right
box_size = large
header = system_message
dismiss = none
highlight = code_box,input_buffer,register,output_buffer
when.won = 1
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
Instruction sequence completed

Deletion, operand replacement, and sequence reordering available
text_end
[tutorial]
format = 1



[welcome]
box = big
header = system_message
dismiss = mouse_press
id = 0
text_begin
ADDRESS 00
text_end


[review_challenge]
box = upper
header = instruction
dismiss = mouse_press
arrow = challenge
id = 1
text_begin
Review the task specification before execution
text_end


[objective_input]
box = upper
header = instruction
dismiss = mouse_press
arrow = input_buffer
id = 2
text_begin
Objective: 
 
Move items from the Input Buffer [ib]
text_end


[objective_output]
box = lower
header = instruction
dismiss = mouse_press
arrow = output_buffer
id = 3
text_begin
To the Output Buffer [ob]
text_end


[register_requirement]
box = center
header = instruction
dismiss = mouse_press
arrow = register
id = 4
text_begin
Values loaded from [ib] must be stored in a Register
text_end


[select_mov]
box = instruction
header = instruction
dismiss = none
arrow = instruction
id = 5
text_begin
Select the MOV instruction
text_end


[place_mov]
box = code
header = instruction
dismiss = none
arrow = drop
id = 6
text_begin
Insert the instruction into the program sequence
text_end


[select_destination_register]
box = center
header = instruction
dismiss = none
arrow = register
id = 7
text_begin
Select rax as the Destination Operand
text_end


[select_input_buffer]
box = upper
header = instruction
dismiss = none
arrow = input_buffer
id = 8
text_begin
Select Input Buffer [ib] as the Source Operand
text_end


[run_first_instruction]
box = code
header = instruction
dismiss = none
arrow = play
id = 9
text_begin
Execute the instruction to inspect its behavior
text_end


[explain_missing_output]
box = center
header = system_warning
dismiss = mouse_press
arrow = error
id = 10
text_begin
The value was moved to rax but not to the Output Buffer [ob]
text_end


[select_second_mov]
box = instruction
header = instruction
dismiss = none
arrow = instruction
id = 11
text_begin
Insert another MOV instruction into the program sequence
text_end


[place_second_mov]
box = code
header = instruction
dismiss = none
arrow = drop
id = 12
text_begin
Append the instruction to the current sequence
text_end


[select_output_buffer]
box = code
header = instruction
dismiss = none
arrow = output_buffer
id = 13
text_begin
Select Output Buffer [ob] as the Destination Operand
text_end


[select_source_register]
box = code
header = instruction
dismiss = none
arrow = register
id = 14
text_begin
Select rax as the Source Operand
text_end


[run_program]
box = code
header = instruction
dismiss = none
arrow = play
id = 15
text_begin
Initiate Program Execution
text_end


[completion]
box = center
header = system_message
dismiss = none
id = 16
text_begin
Run completed
         
Proceed to the next stage
text_end



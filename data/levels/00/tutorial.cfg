[tutorial]
format = 1


[welcome]
box = center_up
text_size = large
box_size = large
header = system_message
dismiss = mouse_press
when.code_size = 0
effects.code_editable = 0
text_begin
ADDRESS 00
text_end


[review_challenge]
box = upper
header = instruction
dismiss = mouse_press
highlight = challenge
when.code_size = 0
effects.code_editable = 0
text_begin
Review the task specification before execution
text_end


[objective_input]
box = center_right
box_size = large
header = instruction
dismiss = mouse_press
highlight = input_buffer,register,output_buffer
when.code_size = 0
effects.code_editable = 0
text_begin
Move one value through this path:

[ib] -> rax -> [ob]
text_end


[register_requirement]
box = lower
box_size = large
header = instruction
dismiss = mouse_press
highlight = register
when.code_size = 0
effects.code_editable = 0
text_begin
A Register temporarily stores a value while the program is running

Use rax between [ib] and [ob]
text_end


[select_mov]
box = instruction
box_size = large
header = instruction
arrow = instruction
dismiss = none
highlight_instruction = MOV
when.code_size = 0
when.holding = 0
text_begin
MOV moves/copies a value:

MOV Destination, Source

Select and drag MOV
text_end


[place_mov]
box = center
header = instruction
dismiss = none
highlight = code_box
when.code_size_max = 2
when.holding = 1
when.held_instruction = MOV
when.operation_error = 0
effects.arrange_enabled = 0
text_begin
Place MOV in the program sequence
text_end


[select_destination_register]
box = center
header = instruction
dismiss = none
arrow = register
highlight = register
when.code_size = 1
when.code_sorted = 1
when.operand_1_pending = 1
effects.code_editable = 0
effects.buffer_selectable = 0
effects.register_selectable = 1
text_begin
The Destination receives the value

Click rax to select it as the Destination
text_end


[select_input_buffer]
box = upper
header = instruction
dismiss = none
arrow = input_buffer
highlight = input_buffer
when.code_size = 1
when.code_sorted = 1
when.operand_2_pending = 1
effects.code_editable = 0
effects.buffer_selectable = 1
effects.register_selectable = 0
text_begin
The Source provides the value

Click [ib] to select it as the Source
text_end

[review_first_mov]
box = center_right
header = system_notice
box_size = large
dismiss = mouse_press
highlight = code_box,input_buffer,register
when.code_size = 1
when.operand_pending = 0
when.play_state = 0
when.operation_error = 0
effects.code_editable = 0
effects.arrange_enabled = 0
text_begin
MOV rax, [ib]

Source: [ib]
Destination: rax

The instruction moves the value from [ib] into rax
text_end


[run_first_instruction]
box = code
header = instruction
dismiss = operation_error
arrow = play
when.code_size = 1
when.operand_pending = 0
when.play_state = 0
when.operation_error = 0
effects.code_editable = 0
effects.code_editable_exception = instruction
effects.arrange_enabled = 0
text_begin
Run the program

Watch the value travel from [ib] into rax
text_end


[explain_missing_output]
box = upper
box_size = large
header = system_warning
dismiss = none
arrow = error
highlight = register,output_buffer
when.code_size = 1
when.operand_pending = 0
when.operation_error = 1
effects.code_editable = 0
effects.arrange_enabled = 0
text_begin
The first MOV moved the value into rax

The value has not reached [ob]

A second MOV is required
text_end


[select_second_mov]
box = instruction
header = instruction
dismiss = none
highlight_instruction = MOV
arrow = instruction
when.code_size = 1
when.holding = 0
when.operand_pending = 0
when.play_state = 0
when.operation_error = 0
text_begin
Add a second MOV to copy the value from rax into [ob]
text_end


[select_output_buffer]
box = lower
header = instruction
dismiss = none
arrow = output_buffer
highlight = output_buffer
when.code_size = 2
when.code_sorted = 1
when.operand_1_pending = 1
effects.code_editable = 0
effects.buffer_selectable = 1
effects.register_selectable = 0
text_begin
The Destination receives the value

Select [ob] as the Destination
text_end


[select_source_register]
box = code
header = instruction
dismiss = none
highlight = register
arrow = register
when.code_size = 2
when.code_sorted = 1
when.operand_1_pending = 0
when.operand_2_pending = 1
effects.code_editable = 0
effects.buffer_selectable = 0
effects.register_selectable = 1
text_begin
The Source provides the value

Select rax as the Source
text_end

[review_program]
box = center_right
box_size = large
header = system_notice
dismiss = mouse_press
highlight = code_box,input_buffer,register,output_buffer
when.code_size = 2
when.operand_pending = 0
when.play_state = 0
when.won = 0
when.operation_error = 0
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
Instructions execute from top to bottom

MOV rax, [ib]
moves [ib] into rax

MOV [ob], rax
copies rax into [ob]
text_end


[run_program]
box = code
header = instruction
dismiss = none
arrow = play
when.code_size = 2
when.operand_pending = 0
when.play_state = 0
when.won = 0
when.operation_error = 0
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
Run the completed program
text_end


[completion]
box = upper
box_size = large
header = system_message
dismiss = none
when.won = 1
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
Run completed

MOV Destination, Source

The Source provides the value
The Destination receives the value
text_end



[tutorial]
format = 1


[welcome]
box = center_up
box_size = large
text_size = large
header = system_message
dismiss = mouse_press
when.code_size = 0
effects.code_editable = 0
text_begin
ADDRESS 00
text_end


[review_challenge]
box = upper
header = instruction
dismiss = mouse_press
highlight = challenge
when.code_size = 0
effects.code_editable = 0
text_begin
@directive Inspect the challenge specification
text_end


[objective]
box = center_right
box_size = large
header = instruction
dismiss = mouse_press
highlight = input_buffer,register,output_buffer
when.code_size = 0
effects.code_editable = 0
text_begin
Establish the complete data path

@syntax [ib] -> rax -> [ob]
text_end


[select_mov]
box = instruction
box_size = large
header = instruction
dismiss = none
arrow = instruction
highlight_instruction = MOV
when.code_size = 0
when.holding = 0
text_begin
MOV transfers the source operand into the destination operand

@syntax MOV destination, source

@directive Acquire MOV
text_end


[place_mov]
box = center
header = instruction
dismiss = none
highlight = code_box
when.code_size_max = 2
when.holding = 1
when.held_instruction = MOV
when.operation_error = 0
effects.arrange_enabled = 0
text_begin
@directive Commit MOV to the instruction sequence
text_end


[select_destination_register]
box = center
header = instruction
dismiss = none
arrow = register
highlight = register
when.code_size = 1
when.code_sorted = 1
when.operand_1_pending = 1
effects.code_editable = 0
effects.buffer_selectable = 0
effects.register_selectable = 1
text_begin
Destination receives the value

@directive Assign rax
text_end


[select_input_buffer]
box = upper
header = instruction
dismiss = none
arrow = input_buffer
highlight = input_buffer
when.code_size = 1
when.code_sorted = 1
when.operand_2_pending = 1
effects.code_editable = 0
effects.buffer_selectable = 1
effects.register_selectable = 0
text_begin
Source provides the value

@directive Assign [ib]
text_end


[review_first_mov]
box = center_right
box_size = large
header = system_notice
dismiss = mouse_press
highlight = code_box,input_buffer,register
when.code_size = 1
when.operand_pending = 0
when.play_state = 0
when.operation_error = 0
effects.code_editable = 0
effects.arrange_enabled = 0
text_begin
@syntax MOV rax, [ib]

The value transfers from [ib] into rax
text_end


[run_first_instruction]
box = code
header = instruction
dismiss = operation_error
arrow = play
when.code_size = 1
when.operand_pending = 0
when.play_state = 0
when.operation_error = 0
effects.code_editable = 0
effects.code_editable_exception = instruction
effects.arrange_enabled = 0
text_begin
@directive Initiate sequence execution
text_end


[explain_missing_output]
box = upper_right
box_size = large
header = system_warning
dismiss = none
arrow = error
highlight = register,output_buffer
when.code_size = 1
when.operand_pending = 0
when.operation_error = 1
effects.code_editable = 0
effects.arrange_enabled = 0
text_begin
@warning Output path incomplete

rax contains the transferred value

[ob] remains empty

@directive Extend the sequence with MOV
text_end


[select_second_mov]
box = instruction
header = instruction
dismiss = none
arrow = instruction
highlight_instruction = MOV
when.code_size = 1
when.holding = 0
when.operand_pending = 0
when.play_state = 0
when.operation_error = 0
text_begin
@directive Acquire another MOV
text_end


[select_output_buffer]
box = lower
header = instruction
dismiss = none
arrow = output_buffer
highlight = output_buffer
when.code_size = 2
when.code_sorted = 1
when.operand_1_pending = 1
effects.code_editable = 0
effects.buffer_selectable = 1
effects.register_selectable = 0
text_begin
Destination receives the value

@directive Assign [ob]
text_end


[select_source_register]
box = code
header = instruction
dismiss = none
arrow = register
highlight = register
when.code_size = 2
when.code_sorted = 1
when.operand_1_pending = 0
when.operand_2_pending = 1
effects.code_editable = 0
effects.buffer_selectable = 0
effects.register_selectable = 1
text_begin
Source provides the value

@directive Assign rax
text_end


[review_program]
box = center_right
box_size = large
header = system_notice
dismiss = mouse_press
highlight = code_box,input_buffer,register,output_buffer
when.code_size = 2
when.operand_pending = 0
when.play_state = 0
when.won = 0
when.operation_error = 0
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
Sequential execution proceeds from top to bottom

@syntax MOV rax, [ib]
@syntax MOV [ob], rax
text_end


[run_program]
box = code
header = instruction
dismiss = none
arrow = play
when.code_size = 2
when.operand_pending = 0
when.play_state = 0
when.won = 0
when.operation_error = 0
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
@directive Initiate sequence execution
text_end


[completion]
box = upper_right
box_size = large
header = system_message
dismiss = none
highlight = code_box,input_buffer,register,output_buffer
when.won = 1
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
Instruction sequence completed

The value reached [ob]

@syntax [ib] -> rax -> [ob]
text_end
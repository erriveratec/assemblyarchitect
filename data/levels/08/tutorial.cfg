[tutorial]
format = 1



[welcome]
box = big
header = system_message
dismiss = mouse_press
id = 0
text_begin
ADDRESS 08
text_end


[review_instruction_limit]
box = upper
header = system_warning
dismiss = mouse_press
arrow = challenge
id = 1
text_begin
Execution is limited to three instructions
text_end


[introduce_jump]
box = lower
header = instruction
dismiss = mouse_press
arrow = instruction
id = 2
text_begin
JMP alters the execution flow by transferring control to a different instruction
text_end


[select_jump]
box = instruction
header = instruction
dismiss = none
arrow = instruction
id = 3
text_begin
Insert the JMP instruction into the program sequence
text_end


[place_jump]
box = code
header = instruction
dismiss = none
id = 4
text_begin
Append the JMP instruction to the end of the execution sequence
text_end


[set_jump_destination]
box = upper
header = instruction
dismiss = none
id = 5
text_begin
Set the JMP destination to the beginning of the execution sequence
text_end



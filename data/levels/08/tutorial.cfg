[tutorial]
format = 1


[welcome]
box = center_up
box_size = large
text_size = large
header = system_message
dismiss = mouse_press
when.code_size = 2
effects.code_editable = 0
text_begin
ADDRESS 08
text_end


[introduce_jump]
box = center_right
box_size = large
header = system_notice
dismiss = mouse_press
highlight = challenge,code_box
highlight_instruction = JMP
when.code_size = 2
effects.code_editable = 0
text_begin
JMP transfers execution to a labeled sequence position

Repeating the transfer sequence processes every input value
text_end


[explain_jump_syntax]
box = instruction
box_size = large
header = instruction
dismiss = mouse_press
arrow = instruction
highlight_instruction = JMP
when.code_size = 2
effects.code_editable = 0
text_begin
JMP continues execution from its destination label

@syntax JMP destination
text_end


[select_jump]
box = instruction
header = instruction
dismiss = none
arrow = instruction
highlight_instruction = JMP
when.code_size = 2
when.holding = 0
when.held_instruction_not = JMP
text_begin
@directive Acquire JMP
text_end


[place_jump]
box = code
header = instruction
dismiss = none
arrow = drop
highlight = code_box
when.code_size_max = 3
when.holding = 1
when.held_instruction = JMP
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
@directive Place JMP at the last position
text_end


[set_jump_destination]
box = center
header = instruction
dismiss = none
highlight = code_box
priority = 10
when.code_size = 4
when.holding = 1
when.held_instruction = LABEL
effects.arrange_enabled = 1
effects.delete_enabled = 0
text_begin
The label defines the JMP destination

@directive Place the label at the first position
text_end
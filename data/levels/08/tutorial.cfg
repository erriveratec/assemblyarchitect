[tutorial]
format = 1



[welcome]
box = big
header = system_message
dismiss = mouse_press
when.code_size = 2
text_begin
ADDRESS 08
text_end


[review_instruction_limit]
box = upper
header = system_warning
dismiss = mouse_press
arrow = challenge
when.code_size = 2
text_begin
Execution is limited to three instructions
text_end


[introduce_jump]
box = lower
header = instruction
dismiss = mouse_press
arrow = instruction
when.code_size = 2
text_begin
JMP alters the execution flow by transferring control to a different instruction
text_end


[select_jump]
box = instruction
header = instruction
dismiss = none
arrow = instruction
when.code_size = 2
when.held_instruction_not = JMP
text_begin
Insert the JMP instruction into the program sequence
text_end


[place_jump]
box = code
header = instruction
dismiss = none
when.code_size = 2
when.holding = 1
when.held_instruction = JMP
text_begin
Append the JMP instruction to the end of the execution sequence
text_end


[set_jump_destination]
box = upper
header = instruction
dismiss = none
when.code_size = 4
when.holding = 1
when.held_instruction = LABEL
text_begin
Set the JMP destination to the beginning of the execution sequence
text_end



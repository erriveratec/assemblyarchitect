[tutorial]
format = 1



[welcome]
box = big
header = system_message
dismiss = mouse_press
id = 0
text_begin
ADDRESS 0D
text_end


[introduce_compare_and_equal]
box = upper
header = system_notice
dismiss = mouse_press
arrow = instruction
id = 1
text_begin
CMP and JE instructions are now available
text_end


[explain_compare]
box = center
header = instruction
dismiss = mouse_press
arrow = instruction
id = 2
text_begin
CMP compares two operands
 
Examples:
CMP rax, rbx
CMP rax, 4
text_end


[explain_zero_flag_set]
box = center_right
header = instruction
dismiss = mouse_press
arrow = zero_flag
id = 3
text_begin
CMP sets the Zero Flag (ZF) when both operands are equal
text_end


[explain_zero_flag_clear]
box = lower
header = instruction
dismiss = mouse_press
arrow = zero_flag
id = 4
text_begin
CMP clears the Zero Flag (ZF) when the operands differ
text_end


[explain_jump_equal]
box = instruction
header = instruction
dismiss = mouse_press
arrow = instruction
id = 5
text_begin
JE jumps when ZF is set
 
Otherwise, execution continues
text_end


[complete_compare_branch_program]
box = center
header = instruction
dismiss = mouse_press
arrow = challenge
id = 6
text_begin
Correct execution requires the use of CMP and JE
text_end



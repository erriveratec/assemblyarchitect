[tutorial]
format = 1
# Tutorial messages for level 13



[message 00]
text_begin
ADDRESS 0D
text_end


[message 01]
text_begin
CMP and JE instructions are now available
text_end


[message 02]
text_begin
CMP compares two operands
 
Examples:
CMP rax, rbx
CMP rax, 4
text_end


[message 03]
text_begin
CMP sets the Zero Flag (ZF) when both operands are equal
text_end


[message 04]
text_begin
CMP clears the Zero Flag (ZF) when the operands differ
text_end


[message 05]
text_begin
JE jumps when ZF is set
 
Otherwise, execution continues
text_end


[message 06]
text_begin
Correct execution requires the use of CMP and JE
text_end


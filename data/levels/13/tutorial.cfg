[tutorial]
format = 1



[welcome]
box = center_up
box_size = large
text_size = large
header = system_message
dismiss = mouse_press
when.code_size = 0
text_begin
ADDRESS 0D
text_end


[introduce_compare_and_equal]
box = code
box_size = large
header = system_notice
dismiss = mouse_press
highlight_instruction = CMP, JE
when.code_size = 0
text_begin
CMP and JE instructions are now available
text_end


[explain_compare]
box = center
box_size = large
header = instruction
dismiss = mouse_press
highlight_instruction = CMP
when.code_size = 0
text_begin
CMP compares two operands
 
Examples:
CMP rax, rbx
CMP rax, 4
text_end


[explain_zero_flag_set]
box = center_right
box_size = large
header = instruction
dismiss = mouse_press
highlight_instruction = CMP
highlight = zero_flag
when.code_size = 0
text_begin
CMP sets the Zero Flag 

(ZF = 1) 

when both operands 
are equal
text_end


[explain_zero_flag_clear]
box = lower
box_size = large
header = instruction
dismiss = mouse_press
highlight_instruction = CMP
highlight = zero_flag
when.code_size = 0
text_begin
CMP clears the Zero Flag 

(ZF = 0) 

when the operands differ
text_end


[explain_jump_equal]
box = instruction
box_size = large
header = instruction
dismiss = mouse_press
highlight_instruction = JE
when.code_size = 0
text_begin
JE jumps when Zero Flag is set (ZF = 1)
 
Otherwise, execution continues
text_end


[complete_compare_branch_program]
box = center
box_size = large
header = instruction
dismiss = mouse_press
highlight = challenge
when.code_size = 0
text_begin
Correct execution requires the use of CMP and JE
text_end



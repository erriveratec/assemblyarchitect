Place MOV after the first instruction
text_end


[select_second_destination]
box = lower
header = instruction
dismiss = none
arrow = output_buffer
highlight = output_buffer
when.code_size = 2
when.holding = 0
when.code_sorted = 1
when.operand_1_pending = 1
effects.code_editable = 0
effects.buffer_selectable = 1
effects.register_selectable = 0
text_begin
Select [ob] as the Destination
text_end


[select_second_source]

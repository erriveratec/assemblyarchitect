[review_reuse]
box = center_right
box_size = large
header = system_notice
dismiss = mouse_press
highlight = code_box,register,output_buffer
when.code_size = 2
when.holding = 0
when.operand_pending = 0
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
rax keeps the value

Copy MOV [ob], rax until the program has four instructions
text_end


[copy_with_two]
box = code
header = instruction
dismiss = none
arrow = code
highlight = code_box
when.code_size = 2
when.holding = 0
when.operand_pending = 0
effects.code_editable = 1
effects.arrange_enabled = 0
effects.delete_enabled = 1
text_begin
Right-click MOV [ob], rax to copy it
text_end

[copy_with_two_again]
box = center
header = instruction
dismiss = none
arrow = code
highlight = code_box
when.code_size = 3
when.holding = 0
when.operand_pending = 0
when.first_operand_1 = RAX
when.first_operand_2 = IB
when.last_operand_1 = OB
when.last_operand_2 = RAX
effects.code_editable = 1
effects.arrange_enabled = 0
effects.delete_enabled = 1
text_begin
Right-click MOV [ob], rax to copy it
text_end



[review_program]
box = center_right
box_size = large
header = system_notice
dismiss = mouse_press
highlight = code_box,input_buffer,register,output_buffer
when.code_size = 4
when.holding = 0
when.operand_pending = 0
when.first_operand_1 = RAX
when.first_operand_2 = IB
when.last_operand_1 = OB
when.last_operand_2 = RAX
when.play_state = 0
when.won = 0
when.operation_error = 0
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
The code does:

One [ib] read

Three [ob] writes
text_end


[run_program]
box = code
header = instruction
dismiss = none
arrow = play
highlight = code_box
when.code_size = 4
when.holding = 0
when.operand_pending = 0
when.first_operand_1 = RAX
when.first_operand_2 = IB
when.last_operand_1 = OB
when.last_operand_2 = RAX
when.play_state = 0
when.won = 0
when.operation_error = 0
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
Run the program
text_end


[completion]
box = upper_right
box_size = large
header = system_message
dismiss = none
highlight = code_box,input_buffer,register,output_buffer
when.won = 1
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
Run completed

Registers keep values for reuse

Right-click copies a complete instruction
text_end

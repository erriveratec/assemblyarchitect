header = instruction
dismiss = none
arrow = register
highlight = register
when.code_size = 1
when.code_sorted = 1
when.operand_1_pending = 1
effects.code_editable = 0
effects.buffer_selectable = 0
effects.register_selectable = 1
text_begin
@directive Assign rax as the destination operand
text_end



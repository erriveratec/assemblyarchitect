[tutorial]
format = 1


[welcome]
box = center_up
box_size = large
text_size = large
header = system_message
dismiss = mouse_press
when.code_size = 0
effects.code_editable = 0
text_begin
ADDRESS 02
text_end


[review_challenge]
box = upper
header = instruction
dismiss = mouse_press
highlight = challenge
when.code_size = 0
effects.code_editable = 0
text_begin
Review the task
text_end


[plan]
box = center_right
box_size = large
header = instruction
dismiss = mouse_press
highlight = input_buffer,register,output_buffer
when.code_size = 0
effects.code_editable = 0
text_begin
Read [ib] once

Keep the value in rax

Write rax to [ob] three times
text_end


[select_first_mov]
box = instruction
header = instruction
dismiss = none
arrow = instruction
highlight_instruction = MOV
when.code_size = 0
when.holding = 0
effects.arrange_enabled = 1
effects.delete_enabled = 1
text_begin
Select and drag MOV
text_end


[place_first_mov]
box = code
header = instruction
dismiss = none
highlight = code_box
when.code_size = 0
when.holding = 1
when.held_instruction = MOV
effects.arrange_enabled = 1
effects.delete_enabled = 1
text_begin
Place MOV in the program
text_end


[place_first_mov_code]
box = code
header = instruction
dismiss = none
highlight = code_box
priority = 10
when.code_size = 1
when.holding = 1
when.held_instruction = MOV
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
Place MOV in the program
text_end


[select_first_destination]
box = center
header = instruction
dismiss = none
arrow = register
highlight = register
when.code_size = 1
when.code_sorted = 1
when.operand_1_pending = 1
effects.code_editable = 0
effects.buffer_selectable = 0
effects.register_selectable = 1
text_begin
Select rax as the Destination
text_end


[select_first_source]
box = upper
header = instruction
dismiss = none
arrow = input_buffer
highlight = input_buffer
when.code_size = 1
when.code_sorted = 1
when.operand_2_pending = 1
effects.code_editable = 0
effects.buffer_selectable = 1
effects.register_selectable = 0
text_begin
Select [ib] as the Source
text_end


[select_second_mov]
box = instruction
header = instruction
dismiss = none
arrow = instruction
highlight_instruction = MOV
when.code_size = 1
when.holding = 0
when.operand_pending = 0
text_begin
Add MOV [ob], rax
text_end


[place_second_mov]
box = code
header = instruction
dismiss = none
arrow = drop
highlight = code_box
when.code_size = 1
when.holding = 1
when.held_instruction = MOV
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
Place MOV after the first instruction
text_end


[place_second_mov_code]
box = code
header = instruction
dismiss = none
highlight = code_box
priority = 20
when.code_size = 2
when.holding = 1
when.held_instruction = MOV
when.operand_1_pending = 1
when.operand_2_pending = 1
effects.code_editable = 0
effects.arrange_enabled = 0
effects.delete_enabled = 0

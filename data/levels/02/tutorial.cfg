[tutorial]
format = 1


[welcome]
box = center_up
box_size = large
text_size = large
header = system_message
dismiss = mouse_press
when.code_size = 0
effects.code_editable = 0
text_begin
ADDRESS 02
text_end


[plan]
box = center_right
box_size = large
header = system_notice
dismiss = mouse_press
highlight = input_buffer,register,output_buffer
when.code_size = 0
effects.code_editable = 0
text_begin
A register retains its value across instructions

Read [ib] once

Write rax to [ob] three times
text_end


[select_first_mov]
box = instruction
header = instruction
dismiss = none
arrow = instruction
highlight_instruction = MOV
when.code_size = 0
when.holding = 0
effects.arrange_enabled = 1
effects.delete_enabled = 1
text_begin
@directive Acquire MOV
text_end


[place_first_mov]
box = code
header = instruction
dismiss = none
highlight = code_box
when.code_size = 0
when.holding = 1
when.held_instruction = MOV
effects.arrange_enabled = 1
effects.delete_enabled = 1
text_begin
@directive Place MOV at the sequence entry
text_end


[place_first_mov_code]
box = code
header = instruction
dismiss = none
highlight = code_box
priority = 10
when.code_size = 1
when.holding = 1
when.held_instruction = MOV
effects.arrange_enabled = 0
effects.delete_enabled = 0
text_begin
@directive Commit MOV at the sequence entry
text_end


[select_first_destination]

[tutorial]
format = 1



[welcome]
box = big
header = system_message
dismiss = mouse_press
when.code_size = 0
effects.code_editable = 0
text_begin
ADDRESS 02
text_end


[explain_input_consumption]
box = upper
header = instruction
dismiss = mouse_press
arrow = input_buffer
when.code_size = 0
effects.code_editable = 0
text_begin
Values retrieved from [ib] are consumed after a single read
text_end


[explain_register_persistence]
box = lower
header = instruction
dismiss = mouse_press
arrow = register
when.code_size = 0
effects.code_editable = 0
text_begin
Register values are persistent across reads
text_end


[select_mov]
box = instruction
header = instruction
dismiss = none
arrow = instruction
when.code_size = 0
when.holding = 0
text_begin
Insert the MOV instruction into the program sequence
text_end


[place_mov]
box = code
header = instruction
dismiss = none
arrow = drop
when.code_size_max = 1
when.holding = 1
text_begin
Insert the instruction into the program sequence
text_end


[explain_available_operands]
